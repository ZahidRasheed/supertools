<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Reader AI</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="header">
    <div class="header-top">
      <h1>News Reader</h1>
      <div class="header-actions">
        <div class="font-controls" title="Text size">
          <button id="btn-font-down" class="icon-btn font-btn" aria-label="Decrease font size">A−</button>
          <button id="btn-font-up" class="icon-btn font-btn" aria-label="Increase font size">A+</button>
        </div>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
        <button id="btn-refresh" class="icon-btn" title="Re-summarize page" aria-label="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>
    </div>
    <p id="page-title" class="page-title">Loading page…</p>
  </header>

  <section id="prompt-bar" class="prompt-bar hidden">
    <label for="session-prompt">One-time prompt override</label>
    <textarea id="session-prompt" rows="3" placeholder="Add extra instructions for this summary only…"></textarea>
    <div class="prompt-actions">
      <button id="btn-apply-prompt" class="btn primary">Apply &amp; Summarize</button>
      <button id="btn-cancel-prompt" class="btn ghost">Cancel</button>
    </div>
  </section>

  <main class="main">
    <div id="state-empty" class="state hidden">
      <p>Open a web page and click <strong>Summarize</strong> to get started.</p>
    </div>

    <div id="state-loading" class="state hidden">
      <div class="spinner"></div>
      <p id="loading-text">Reading page and summarizing…</p>
    </div>

    <div id="state-error" class="state hidden">
      <p id="error-text" class="error-text"></p>
      <button id="btn-open-settings" class="btn primary hidden">Open Settings</button>
      <button id="btn-retry" class="btn ghost">Try again</button>
    </div>

    <div id="state-warning" class="state hidden">
      <div class="warning-panel">
        <p class="warning-intro">Review before sending to Gemini:</p>
        <ul id="warning-list" class="warning-list"></ul>
        <dl id="warning-preview" class="warning-preview"></dl>
      </div>
      <div class="warning-actions">
        <button id="btn-warning-cancel" class="btn ghost">Cancel</button>
        <button id="btn-warning-continue" class="btn primary">Continue anyway</button>
      </div>
    </div>

    <div id="state-result" class="state hidden">
      <div class="result-meta">
        <span id="cache-badge" class="badge hidden">Cached</span>
        <span id="cached-date" class="muted"></span>
      </div>
      <article id="summary-content" class="summary"></article>
    </div>
  </main>

  <footer class="footer">
    <div class="clip-bar">
      <select id="clip-vault" class="clip-vault-select" title="Obsidian vault"></select>
      <button id="btn-clip" class="btn secondary" title="Clip current selection to Obsidian">Clip</button>
    </div>
    <div class="footer-actions">
      <button id="btn-edit-prompt" class="btn secondary">Edit prompt</button>
      <button id="btn-summarize" class="btn primary">Summarize</button>
    </div>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
